<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Primer</title>
  <desc id="desc">A field-notes style cover for an agentic Pi and Obsidian learning vault.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.5" fill="#173f36" opacity="0.09"/>
      <circle cx="13" cy="11" r="0.45" fill="#173f36" opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173f36" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#eee9dc"/>
  <rect width="1200" height="560" rx="18" fill="url(#grain)"/>
  <path d="M66 58H1134" stroke="#a9a18f" stroke-width="1"/>
  <text x="68" y="42" fill="#2f6b5e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">ACADEMIC · PI · OBSIDIAN</text>
  <text x="68" y="199" fill="#202722" font-family="Georgia, Times New Roman, serif" font-size="112" font-weight="700" letter-spacing="-5">Primer</text>
  <text x="74" y="247" fill="#485049" font-family="Georgia, Times New Roman, serif" font-size="28">A vault that studies with you.</text>
  <g transform="translate(74 310)">
    <circle cx="8" cy="-5" r="6" fill="#2f6b5e"/><path d="M5 -5l2 2 4-5" fill="none" stroke="#eee9dc" stroke-width="1.6"/>
    <text x="27" y="1" fill="#303832" font-family="Arial, Helvetica, sans-serif" font-size="17">Probe before teaching</text>
    <circle cx="8" cy="39" r="6" fill="#b88a2d"/><path d="M5 39h6" stroke="#eee9dc" stroke-width="1.6"/>
    <text x="27" y="45" fill="#303832" font-family="Arial, Helvetica, sans-serif" font-size="17">One reasoning step at a time</text>
    <circle cx="8" cy="83" r="6" fill="#2f6b5e"/><path d="M5 83l2 2 4-5" fill="none" stroke="#eee9dc" stroke-width="1.6"/>
    <text x="27" y="89" fill="#303832" font-family="Arial, Helvetica, sans-serif" font-size="17">Notes, cards, sources, and practice stay linked</text>
  </g>
  <g transform="translate(720 92) rotate(2 190 190)" filter="url(#shadow)">
    <rect width="400" height="382" rx="4" fill="#fffdf7" stroke="#b8b09d"/>
    <rect x="28" y="26" width="344" height="4" fill="#2f6b5e"/>
    <text x="30" y="67" fill="#202722" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Understanding map</text>
    <text x="30" y="92" fill="#6a716c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.1">FOUNDATIONS OF LOGIC / TERM 01</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#303832">
      <circle cx="40" cy="135" r="8" fill="#2f6b5e"/><path d="M36 135l3 3 6-8" stroke="#fffdf7" stroke-width="2" fill="none"/>
      <text x="60" y="141">Proposition has a truth value</text>
      <circle cx="40" cy="181" r="8" fill="#b88a2d"/><text x="37.5" y="186" fill="#fffdf7" font-weight="700">/</text>
      <text x="60" y="187">Converse needs one check</text>
      <circle cx="40" cy="227" r="8" fill="#707871"/><text x="36.5" y="232" fill="#fffdf7" font-weight="700">?</text>
      <text x="60" y="233">Contrapositive not probed</text>
    </g>
    <path d="M40 284H112L143 312L177 266L218 307L258 282L302 312L352 270" fill="none" stroke="#2f6b5e" stroke-width="2"/>
    <g fill="#2f6b5e"><circle cx="40" cy="284" r="4"/><circle cx="143" cy="312" r="4"/><circle cx="177" cy="266" r="4"/><circle cx="218" cy="307" r="4"/><circle cx="302" cy="312" r="4"/><circle cx="352" cy="270" r="4"/></g>
    <text x="30" y="354" fill="#6a716c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">probe → teach → retain → test</text>
  </g>
