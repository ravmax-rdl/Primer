<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Primer architecture</title>
  <desc id="desc">Pi passes through project skills and extensions into an Obsidian vault and a repeatable learning workflow.</desc>
  <rect width="1200" height="300" rx="16" fill="#eee9dc"/>
  <text x="54" y="50" fill="#2f6b5e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2">PRIMER / SYSTEM VIEW</text>
  <g transform="translate(54 84)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="214" height="150" rx="5" fill="#fffdf7" stroke="#a9a18f"/>
      <text x="24" y="43" fill="#6a716c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.4">01 / INTERFACE</text>
      <text x="24" y="86" fill="#202722" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700">Pi</text>
      <text x="24" y="116" fill="#59615b" font-size="15">conversation + tools</text>
    </g>
    <path d="M226 75h50m-12-10 12 10-12 10" fill="none" stroke="#2f6b5e" stroke-width="2"/>
    <g transform="translate(288)">
      <rect width="248" height="150" rx="5" fill="#fffdf7" stroke="#a9a18f"/>
      <text x="24" y="43" fill="#6a716c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.4">02 / BEHAVIOR</text>
      <text x="24" y="82" fill="#202722" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700">Skills + extensions</text>
      <text x="24" y="116" fill="#59615b" font-size="15">prompts · guard · scripts</text>
    </g>
    <path d="M548 75h50m-12-10 12 10-12 10" fill="none" stroke="#2f6b5e" stroke-width="2"/>
    <g transform="translate(610)">
      <rect width="214" height="150" rx="5" fill="#fffdf7" stroke="#a9a18f"/>
      <text x="24" y="43" fill="#6a716c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.4">03 / MEMORY</text>
      <text x="24" y="86" fill="#202722" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700">Vault</text>
      <text x="24" y="116" fill="#59615b" font-size="15">notes · cards · Bases</text>
    </g>
    <path d="M836 75h50m-12-10 12 10-12 10" fill="none" stroke="#2f6b5e" stroke-width="2"/>
    <g transform="translate(898)">
      <rect width="194" height="150" rx="5" fill="#2f6b5e"/>
      <text x="24" y="43" fill="#c9ddd6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.4">04 / PRACTICE</text>
      <text x="24" y="82" fill="#fffdf7" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="700">Learning loop</text>
      <text x="24" y="116" fill="#e7f0ec" font-size="14">probe → teach → test</text>
    </g>
  </g>
</svg>
